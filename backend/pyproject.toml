[project]
name = "lenny-growth-assistant"
version = "0.1.0"
description = "Lenny Growth Assistant backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.40",
  "psycopg==3.2.13",
  "pydantic-settings==2.6.1",
  "alembic==1.15.2",
  "python-dotenv==1.1.0",
  "openai==1.88.0",
  "anthropic==0.62.0",
  "ollama==0.5.1",
  "python-multipart==0.0.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.0",
  "pytest-asyncio==1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
